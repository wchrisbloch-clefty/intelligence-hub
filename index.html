<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111A16" />
  <title>The Film Room — Intelligence Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ── The Film Room token system ── */
      --ink:            #111A16;   /* chalkboard background — warm pine-charcoal */
      --surface:        #18231E;   /* raised card tone */
      --chalk:          #F2EFE6;   /* primary text — warm off-white */
      --chalk-dim:      #9BA69B;   /* secondary text */
      --accent:         #D9A441;   /* single confident brass — active/progress/CTA only */
      --line:           #2A362F;   /* hairline dividers */

      /* Derived / legacy aliases (whole app reads these) */
      --bg:            var(--ink);
      --bg-alt:        #0D140F;
      --bg-nav:        #0F1712;
      --surf2:         #1F2C25;
      --border:        var(--line);
      --bord2:         rgba(242,239,230,0.06);
      --border-dim:    rgba(242,239,230,0.03);
      --overlay:       rgba(9,14,11,0.86);
      --text:          var(--chalk);
      --text-b:        #DCD9CE;
      --text-c:        #C4C2B6;
      --muted:         var(--chalk-dim);
      --subtle:        #7C877C;
      --dim:           #5E685E;
      --u-bubble:      #1F2C25;
      --u-bubble-b:    #2A362F;
      --u-bubble-text: #DCD9CE;
      --scrollbar:     #2A362F;
      --scrollbar-h:   #3A4740;
      --accent-glow:   rgba(217,164,65,0.12);
      --accent2:       #B8862E;
      --gold:          var(--accent);
      --green:         #86A67A;
      --red:           #C4553D;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text-b);
      font-family: 'Atkinson Hyperlegible', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-h); }

    /* Visible keyboard focus — accessibility */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    @keyframes pulse { 0%,100%{opacity:.35;transform:scale(.85)} 50%{opacity:1;transform:scale(1.1)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes riseIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideRight { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
    @keyframes slideInRight { from{opacity:0;transform:translateX(100%)} to{opacity:1;transform:translateX(0)} }
    @keyframes glow { 0%,100%{box-shadow:0 0 20px rgba(217,164,65,.05)} 50%{box-shadow:0 0 36px rgba(217,164,65,.12)} }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
    .shimmer {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surf2) 50%, var(--surface) 75%);
      background-size: 400px 100%;
      animation: shimmer 1.4s infinite;
    }
    /* Page-load stagger — cards rise 8px + fade, 40ms apart */
    .rise { opacity: 0; animation: riseIn 0.4s ease forwards; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
      .rise { opacity: 1; }
    }
  </style>
  <!-- Prevent flash of wrong theme on load -->
  <script>
    (function() {
      if (localStorage.getItem('aether-theme') !== 'light') return;
      var vars = {
        '--ink': '#EDE9E0', '--surface': '#F6F3EC', '--chalk': '#1E2A22',
        '--chalk-dim': '#5E685E', '--accent': '#B8862E', '--line': 'rgba(30,42,34,0.12)',
        '--bg-alt': '#E4DED2', '--bg-nav': '#F6F3EC', '--surf2': '#E7E1D5',
        '--bord2': 'rgba(30,42,34,0.08)', '--border-dim': 'rgba(30,42,34,0.04)',
        '--overlay': 'rgba(30,30,20,0.4)', '--text-b': '#2E3A32', '--text-c': '#3E4A42',
        '--subtle': '#6B746A', '--dim': '#98A098', '--u-bubble': '#E7E1D5',
        '--u-bubble-b': '#D6CFC0', '--u-bubble-text': '#2E3A32', '--scrollbar': '#D6CFC0',
        '--scrollbar-h': '#C4BCAC', '--accent-glow': 'rgba(184,134,46,0.10)',
        '--accent2': '#8A6420', '--green': '#5A7A4A', '--red': '#B04A32'
      };
      var r = document.documentElement.style;
      for (var k in vars) r.setProperty(k, vars[k]);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
